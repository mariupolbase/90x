l_russian:
 BM_HISTORY_TITLE: "Краткая История"
 GATHERING_STORM_NAME: "Новый Мир девяностых"
 GATHERING_STORM_DESC: "1 января 1990 года. Берлинская стена уже пала, Восточная Европа выходит из-под советского контроля, а объединение Германии — вопрос ближайших месяцев. В Персидском заливе назревает кризис, но куда больший — в Москве. Внутри самого Советского Союза заканчивается терпение: дефицит, национальные движения и разговоры о новом союзном договоре ставят под вопрос само существование страны в прежнем виде. У остального мира есть год, чтобы понять, что придёт на смену холодной войне."

 SOV_GATHERING_STORM_DESC: "Январь 1990 года. Пять лет перестройки и гласности изменили страну сильнее, чем ожидал сам инициатор реформ. Полки пустеют, республики требуют суверенитета, а внутри партии нарастает раскол между реформаторами и теми, кто хочет всё вернуть. Горбачёв удерживает Союз политическим манёвром — надолго ли, решит этот год."
 USA_GATHERING_STORM_DESC: "Январь 1990 года. Администрация Буша наблюдает, как рушится советский блок в Восточной Европе, и думает, как закрепить победу в холодной войне, не обрушив вместе с побеждённым противником весь мировой порядок. Экономика выходит из рецессии конца 80-х, а на горизонте — операция в Панаме и растущее напряжение с Ираком."
 FRA_GATHERING_STORM_DESC: "Январь 1990 года. Франция Миттерана всё активнее играет на объединении Европы, пока Германия готовится к воссоединению у самых её границ. Управляемый распад советского блока Парижу выгоднее, чем хаос — поэтому Горбачёва здесь скорее поддерживают, чем опасаются."
 ENG_GATHERING_STORM_DESC: "Январь 1990 года. Британия Тэтчер настороженно наблюдает за скорым объединением Германии, а внутри страны копится усталость от одиннадцати лет её премьерства. Особые отношения с Вашингтоном остаются главным приоритетом внешней политики Лондона."
 GER_GATHERING_STORM_DESC: "Январь 1990 года. Падение Берлинской стены сделало объединение Германии вопросом не «если», а «когда». Канцлер Коль спешит зафиксировать момент, пока не изменились воля Москвы и настроение союзников."
 ITA_GATHERING_STORM_DESC: "Январь 1990 года. Италия встречает десятилетие на фоне хронической нестабильности христианско-демократических коалиций — и первых признаков кризиса, который скоро обрушит всю партийную систему страны."
 JAP_GATHERING_STORM_DESC: "Январь 1990 года. Япония всё ещё живёт эпохой экономического бума, хотя первые трещины в финансовых пузырях уже появились. Токио наблюдает за концом холодной войны как за сменой декораций, а не своей проблемой."
 OTHER_GATHERING_STORM_DESC: "Январь 1990 года. Мир, привыкший к порядку двух блоков, готовится к его исчезновению — для одних стран это шанс, для других угроза, а для многих — то и другое сразу."
