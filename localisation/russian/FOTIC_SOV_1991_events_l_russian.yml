l_russian:
 FOTIC_SOV_1991.1.a:0 "Начать"

 FOTIC_SOV_1991.2.t:0 "Первое утро 1991 года"
 FOTIC_SOV_1991.2.d:0 "Год начинается без праздничного благодушия. Полки не заполнились сами, республики не передумали, а декабрьский итог 1990-го уже не спишешь на переходный период. Всё, что было отложено, теперь придётся решать в реальном времени."
 FOTIC_SOV_1991.2.a:0 "Считать итоги 1990-го уроком, а не оправданием"
 FOTIC_SOV_1991.2.b:0 "Держать партийную дисциплину любой ценой"
 FOTIC_SOV_1991.2.c:0 "Дать КГБ карт-бланш на порядок"
 FOTIC_SOV_1991.2.e:0 "Готовить новый Союзный договор"

 FOTIC_SOV_1991.100.a:0 "Продолжать"

 FOTIC_SOV_1991.10.t:0 "Штурм в Вильнюсе"
 FOTIC_SOV_1991.10.d_soft:0 "В ночь на 13 января армия и КГБ идут на штурм телецентра в Вильнюсе. Бакатинская линия на сдержанность в МВД не помешала силовому сценарию — решение принималось не в его кабинете. Жертвы уже есть, и Москве нужно определить официальную позицию по случившемуся."
 FOTIC_SOV_1991.10.d_hard:0 "В ночь на 13 января армия и КГБ штурмуют телецентр в Вильнюсе. Погибшие исчисляются десятками. Союзное руководство слишком долго заигрывало с силовым решением прибалтийского вопроса — и вот результат, который теперь нужно либо взять на себя, либо от него откреститься."
 FOTIC_SOV_1991.10.d:0 "В ночь на 13 января армия и КГБ штурмуют телецентр в Вильнюсе, пытаясь остановить литовское провозглашение независимости силой. Есть жертвы. Западные столицы уже готовят заявления, и Москве нужно решить, как объяснить произошедшее."
 FOTIC_SOV_1991.10.a:0 "Поддержать действия силовиков"
 FOTIC_SOV_1991.10.b:0 "Дистанцироваться и обещать расследование"

 FOTIC_SOV_1991.11.t:0 "Павловская реформа"
 FOTIC_SOV_1991.11.d:0 "22 января премьер Павлов объявляет об изъятии из обращения купюр в 50 и 100 рублей — под предлогом борьбы со спекулянтами и «нетрудовыми доходами». На обмен дают три дня. У сберкасс выстраиваются очереди, и в толпе всё чаще звучит слово «грабёж»."
 FOTIC_SOV_1991.11.a:0 "Провести обмен жёстко, по графику"
 FOTIC_SOV_1991.11.b:0 "Смягчить условия и продлить сроки"

 FOTIC_SOV_1991.12.t:0 "Шахтёры снова бастуют"
 FOTIC_SOV_1991.12.d:0 "Кузбасские стачкомы, так и не распущенные с прошлого года, объявляют новую волну забастовок. На этот раз к экономическим требованиям добавляется политическое: отставка союзного руководства и передача власти республикам."
 FOTIC_SOV_1991.12.a:0 "Пойти на уступки шахтёрам"
 FOTIC_SOV_1991.12.b:0 "Не поддаваться давлению"

 FOTIC_SOV_1991.20.t:0 "Всесоюзный референдум"
 FOTIC_SOV_1991.20.d_boycott:0 "17 марта проходит референдум о сохранении обновлённого Союза. В ряде республик местные власти отказываются организовывать голосование вовсе — бюллетени печатают явочным порядком, где придётся. Формальный результат будет, но его легитимность уже под вопросом."
 FOTIC_SOV_1991.20.d_hope:0 "17 марта проходит референдум о сохранении обновлённого Союза. Подготовка нового договора вселяет умеренный оптимизм, и большинство участников голосования отвечают «да». Но вопрос был сформулирован обтекаемо, и каждая сторона уже готова трактовать результат в свою пользу."
 FOTIC_SOV_1991.20.d:0 "17 марта проходит референдум о сохранении обновлённого Союза. Явка и результаты неоднородны от республики к республике. Формально страна проголосовала за сохранение федерации — но за этим «да» стоят совершенно разные ожидания."
 FOTIC_SOV_1991.20.a:0 "Объявить референдум мандатом на новый Союз"
 FOTIC_SOV_1991.20.b:0 "Признать, что раскол глубже, чем показывают цифры"

 FOTIC_SOV_1991.21.t:0 "Ново-Огарёвский процесс"
 FOTIC_SOV_1991.21.d:0 "В Ново-Огарёве начинаются переговоры «9+1» — девять республик и союзный центр обсуждают текст нового Союзного договора. Формула федерации, полномочия центра, судьба армии и бюджета — всё заново на столе. Консерваторы в аппарате следят за процессом с растущим раздражением."
 FOTIC_SOV_1991.21.a:0 "Дожимать подписание нового договора"
 FOTIC_SOV_1991.21.b:0 "Не форсировать, дать республикам время"

 FOTIC_SOV_1991.30.t:0 "Выборы президента РСФСР"
 FOTIC_SOV_1991.30.d_landslide:0 "12 июня Борис Ельцин избирается первым президентом РСФСР в первом же туре, с внушительным перевесом. У России впервые появляется собственный всенародно избранный лидер — и легитимность, которой нет у союзного центра."
 FOTIC_SOV_1991.30.d:0 "12 июня Борис Ельцин избирается первым президентом РСФСР. Результат не безоговорочный, но достаточный для победы в первом туре. У России впервые появляется собственный всенародно избранный лидер."
 FOTIC_SOV_1991.30.a:0 "Признать итоги и работать с Ельциным как с президентом"
 FOTIC_SOV_1991.30.b:0 "Оспаривать легитимность через союзные структуры"

 FOTIC_SOV_1991.40.t:0 "Государственный комитет по чрезвычайному положению"
 FOTIC_SOV_1991.40.d_committee:0 "Рано утром 19 августа радио объявляет о введении чрезвычайного положения. Горбачёв «по состоянию здоровья» отстранён от исполнения обязанностей. Власть берёт на себя ГКЧП — Янаев, Крючков, Язов, Павлов и их союзники, много месяцев готовившие именно этот момент. В Москву входят танки."
 FOTIC_SOV_1991.40.d_faction:0 "Рано утром 19 августа радио объявляет о введении чрезвычайного положения. Единого политического руководства за этим не стоит — это скорее действие силовых структур, решивших, что дальше тянуть с «наведением порядка» нельзя. В Москву входят танки, но координация между участниками неполная."
 FOTIC_SOV_1991.40.d:0 "Рано утром 19 августа радио внезапно объявляет о введении чрезвычайного положения и отстранении Горбачёва «по состоянию здоровья». Заявление звучит неубедительно даже для самих дикторов. В Москву входит техника, но происходящее больше похоже на браваду, чем на подготовленный переворот."
 FOTIC_SOV_1991.40.a:0 "Поддержать чрезвычайное положение"
 FOTIC_SOV_1991.40.b:0 "Осудить заговорщиков и поддержать законную власть"

 FOTIC_SOV_1991.50.a:0 "Подвести итог 1991 года"

 FOTIC_SOV_1991.51.t:0 "Занавес держится силой"
 FOTIC_SOV_1991.51.d:0 "Декабрь 1991-го. Чрезвычайное положение не снято — оно стало формой правления. Союз формально существует, реформы свёрнуты, оппозиция уходит в подполье или эмиграцию. Занавес не упал — его удержали силой, и вопрос лишь в том, насколько долго это возможно."
 FOTIC_SOV_1991.51.a:0 "Понять, что дальше"

 FOTIC_SOV_1991.52.t:0 "Слабый, но живой Союз"
 FOTIC_SOV_1991.52.d:0 "Декабрь 1991-го. Новый Союзный договор всё-таки подписан — не в прежнем виде, а как рыхлая конфедерация суверенных государств. Центр слаб, полномочия размыты, но формально страна не распалась. Занавес не упал — он истрепался, но остался на месте."
 FOTIC_SOV_1991.52.a:0 "Работать с тем, что получилось"

 FOTIC_SOV_1991.53.t:0 "Распад без порядка"
 FOTIC_SOV_1991.53.d:0 "Декабрь 1991-го. Провал ГКЧП добил и без того слабый центр, а на местах слишком многое уже вышло из-под контроля, чтобы развод получился цивилизованным. Союз распадается не за столом переговоров, а явочным порядком — и не факт, что без крови."
 FOTIC_SOV_1991.53.a:0 "Встретить это, как есть"

 FOTIC_SOV_1991.54.t:0 "Занавес падает"
 FOTIC_SOV_1991.54.d:0 "Декабрь 1991-го. Августовский путч провалился, доверие к союзному центру рухнуло вместе с ним, и один за другим лидеры республик выбирают собственный путь. Союз, о судьбе которого спорили весь год, прекращает существование — тихо, по итогам переговоров, а не по итогам войны."
 FOTIC_SOV_1991.54.a:0 "Принять конец Союза"
